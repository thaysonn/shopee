version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    # Also allow a version-update job for the lab package while security updates are pending.
    open-pull-requests-limit: 1
    allow:
      - dependency-name: lodash
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    allow:
      - dependency-name: Newtonsoft.Json
